name: .NET Desktop

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "WondayWall/**"
      - "WondayWall.Package/**"
      - "WondayWall.Wix/**"
      - "WondayWall.sln"
      - "GitVersion.yml"
      - ".config/**"
      - "eng/**"
      - ".github/workflows/dotnet-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "WondayWall/**"
      - "WondayWall.Package/**"
      - "WondayWall.Wix/**"
      - "WondayWall.sln"
      - "GitVersion.yml"
      - ".config/**"
      - "eng/**"
      - ".github/workflows/dotnet-desktop.yml"

env:
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  license:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.wixproj', '.config/dotnet-tools.json', 'eng/licenses/*.json', 'Directory.Packages.props', 'Directory.Build.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore WondayWall.sln

      - name: Generate third-party notices
        run: |
          New-Item -ItemType Directory -Force licenses
          dotnet tool run nuget-license `
            -i WondayWall.sln `
            -t `
            -a eng\licenses\allowed-licenses.json `
            -override eng\licenses\package-overrides.json `
            -ignore eng\licenses\license-download-ignored-packages.json `
            -d licenses `
            -fo licenses\THIRD-PARTY-NOTICES.md `
            -o Markdown `
            -err

      - name: Verify THIRD-PARTY-NOTICES.md is not empty
        run: |
          if (!(Test-Path "licenses\THIRD-PARTY-NOTICES.md")) {
            throw "THIRD-PARTY-NOTICES.md was not found."
          }
          if ((Get-Item "licenses\THIRD-PARTY-NOTICES.md").Length -eq 0) {
            throw "THIRD-PARTY-NOTICES.md is empty."
          }

      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: licenses\

  build:
    needs:
      - license
    strategy:
      matrix:
        self: [true, false]
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gitversion.outputs.assemblySemFileVer }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.wixproj', '.config/dotnet-tools.json', 'eng/licenses/*.json', 'Directory.Packages.props', 'Directory.Build.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: "6.x"
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: publish\licenses
      - run: |
          dotnet publish WondayWall -c Release -o publish `
            -p:DebugType=None `
            -p:RuntimeIdentifier=win-x64 `
            -p:PublishSingleFile=true `
            -p:PublishSelfContained=${{ matrix.self }} `
            -p:Version=${{ steps.gitversion.outputs.fullSemVer }} `
            -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} `
            -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} `
            -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
      - name: Verify THIRD-PARTY-NOTICES.md in publish output
        run: |
          if (!(Test-Path "publish\licenses\THIRD-PARTY-NOTICES.md")) {
            throw "THIRD-PARTY-NOTICES.md was not found in publish output."
          }
      - uses: actions/upload-artifact@v7
        with:
          name: WondayWall${{ matrix.self && '-full' || '' }}-${{ steps.gitversion.outputs.fullSemVer }}
          path: publish\

  installer:
    needs:
      - build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.wixproj', '.config/dotnet-tools.json', 'eng/licenses/*.json', 'Directory.Packages.props', 'Directory.Build.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      # WondayWall-full-* は SelfContained=true のビルド成果物
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: WondayWall-full-*
          merge-multiple: true

      - name: Verify THIRD-PARTY-NOTICES.md in artifacts
        run: |
          if (!(Test-Path "artifacts\licenses\THIRD-PARTY-NOTICES.md")) {
            throw "THIRD-PARTY-NOTICES.md was not found in artifacts."
          }

      - run: |
          dotnet run --project WondayWall.Wix.csproj -c Release
          dotnet build WondayWall.Installer.wixproj -p:OutputName=WondayWall-${{ needs.build.outputs.version }}
        working-directory: WondayWall.Wix

      - name: Generate MSIX
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'

          # Windows SDK に同梱の makeappx.exe を検索
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'makeappx.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) {
            throw 'makeappx.exe が見つかりません。Windows SDK が必要です。'
          }

          Write-Host "makeappx.exe: $makeappx"

          # MSIX 用アイコン画像を各ロゴサイズへリサイズして生成
          $iconSrc = 'docs\assets\icon_512.png'
          $imagesDir = 'msix-staging\Images'
          New-Item -ItemType Directory -Force -Path $imagesDir | Out-Null
          magick $iconSrc -resize 44x44 "$imagesDir\Square44x44Logo.png"
          magick $iconSrc -resize 150x150 "$imagesDir\Square150x150Logo.png"
          magick $iconSrc -resize 310x150 -background transparent -gravity center -extent 310x150 "$imagesDir\Wide310x150Logo.png"
          magick $iconSrc -resize 50x50 "$imagesDir\StoreLogo.png"

          # アプリバイナリをステージングへコピー
          Copy-Item 'artifacts\*' 'msix-staging\' -Recurse -Force

          # マニフェストのバージョン文字列を差し替えてステージングへ配置
          $manifest = Get-Content 'WondayWall.Package\AppxManifest.xml' -Raw -Encoding UTF8
          $manifest = $manifest.Replace('Version="0.0.0.0"', "Version=`"$version`"")
          Set-Content 'msix-staging\AppxManifest.xml' $manifest -Encoding UTF8

          # MSIX をパック（/nv = 署名検証スキップ）
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          & $makeappx pack /d msix-staging /p "publish\WondayWall-$version.msix" /nv
          if ($LASTEXITCODE -ne 0) {
            throw "makeappx failed with exit code $LASTEXITCODE"
          }

          Write-Host "MSIX generated: publish\WondayWall-$version.msix"

      - uses: actions/upload-artifact@v7
        with:
          name: WondayWall-${{ needs.build.outputs.version }}.msi
          path: publish\*.msi

      - uses: actions/upload-artifact@v7
        with:
          name: WondayWall-${{ needs.build.outputs.version }}.msix
          path: publish\*.msix

  store-upload:
    name: Upload MSIX to main-build package flight
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    needs:
      - installer
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MSSTORE_CUSTOMER_GROUP_ID: "1152921504607280733"
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WondayWall-*.msix
          path: msix-artifacts
          merge-multiple: true

      - uses: microsoft/microsoft-store-apppublisher@v1

      - name: Configure Partner Center authentication
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}" `
            --sellerId "${{ secrets.SELLER_ID }}"

      - name: Resolve or create main-build package flight
        id: resolve-flight
        run: |
          $productId = "${{ vars.MSSTORE_PRODUCT_ID }}"
          $configuredFlightId = "${{ vars.MSSTORE_FLIGHT_ID }}"
          $customerGroupId = $env:MSSTORE_CUSTOMER_GROUP_ID

          $flightId = $null
          if ($configuredFlightId) {
            msstore flights get "$productId" "$configuredFlightId" *> $null
            if ($LASTEXITCODE -eq 0) {
              $flightId = $configuredFlightId
            }
          }

          if (-not $flightId) {
            $flightList = msstore flights list "$productId" | Out-String
            if ($LASTEXITCODE -eq 0) {
              Write-Host $flightList
              $plainFlightList = $flightList -replace '\x1B\[[0-?]*[ -/]*[@-~]', ''
              $plainFlightList = $plainFlightList -replace '([0-9a-f])\s+([0-9a-f])', '$1$2'
              $flightMatch = [regex]::Match(
                $plainFlightList,
                '(?is)([0-9a-f]{8})-\s*([0-9a-f]{4})-\s*([0-9a-f]{4})-\s*([0-9a-f]{4})-\s*([0-9a-f]{12})\s+main-build\b'
              )
              if ($flightMatch.Success) {
                $flightId = @(
                  $flightMatch.Groups[1].Value,
                  $flightMatch.Groups[2].Value,
                  $flightMatch.Groups[3].Value,
                  $flightMatch.Groups[4].Value,
                  $flightMatch.Groups[5].Value
                ) -join '-'
              }
            }
          }

          if (-not $flightId) {
            $createOutput = msstore flights create `
              "$productId" `
              "main-build" `
              --group-ids "$customerGroupId" | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the main-build package flight."
            }

            $flightId = [regex]::Match(
              $createOutput,
              '(?i)[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}'
            ).Value
          }

          if (-not $flightId) {
            throw "Could not resolve the FlightId for the main-build package flight."
          }
          Write-Host "Using main-build FlightId: $flightId"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "flight_id=$flightId"

      - name: Upload MSIX to main-build package flight
        run: |
          $msixPath = Get-ChildItem -Path msix-artifacts -Filter "*.msix" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $msixPath) {
            throw "No MSIX file found in msix-artifacts. Ensure the installer job produced a WondayWall-*.msix artifact."
          }
          msstore publish `
            "$msixPath" `
            -id "${{ vars.MSSTORE_PRODUCT_ID }}" `
            -f "${{ steps.resolve-flight.outputs.flight_id }}" `
            --noCommit

      - name: Publish main-build package flight submission
        if: startsWith(github.ref, 'refs/tags/') && vars.MSSTORE_SUBMIT_ON_TAG == 'true'
        run: |
          msstore flights submission publish `
            "${{ vars.MSSTORE_PRODUCT_ID }}" `
            "${{ steps.resolve-flight.outputs.flight_id }}"
